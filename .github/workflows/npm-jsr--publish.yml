name: Publish Package to jsr and npmjs
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # 2.0.5
        with:
          deno-version: vx.x.x # Run with latest stable Deno.
      - run: npm ci
      - run: deno install
      - run: npm run build
      - run: deno fmt
      - run: deno publish --set-version $(jq -r '.version' package.json)
      - run: npm stage publish --access public
